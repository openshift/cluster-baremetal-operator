# This patch adds the https metrics port and TLS volume mount to the controller manager.
# Authentication and authorization for the /metrics endpoint is handled by
# controller-runtime's SecureServing with WithAuthenticationAndAuthorization.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-baremetal-operator
  namespace: openshift-machine-api
  labels:
    k8s-app: cluster-baremetal-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: cluster-baremetal-operator
  template:
    metadata:
      annotations:
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
        openshift.io/required-scc: anyuid
      labels:
        k8s-app: cluster-baremetal-operator
    spec:
      containers:
      - name: cluster-baremetal-operator
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: cluster-baremetal-operator-tls
          mountPath: /etc/tls/private
          readOnly: true
      volumes:
        - name: cluster-baremetal-operator-tls
          secret:
            secretName: cluster-baremetal-operator-tls
            defaultMode: 420
